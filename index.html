<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busca — instrumento terapéutico</title>
<link rel="stylesheet" href="src/theme/tokens.css">
<style>
  /* Estructura. Los COLORES viven en tokens.css, generado desde los datos normativos. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 16px/1.5 system-ui, sans-serif; }

  .frame-root {
    min-height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  /* Zona de referencia del objetivo: FUERA del tablero y no activable. Si el paciente
     pudiera activarla, la tarea cambia. */
  .objetivo {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.25rem;
    border-bottom: 2px solid var(--frame-line);
  }
  .objetivo::before {
    content: 'Busca:';
    color: var(--frame-ink-soft);
  }
  .objetivo-glifo { font-size: 2.5rem; line-height: 1; }
  .objetivo-nombre {
    font-size: 1.25rem;
    font-weight: 600;
    /* El único uso del acento en todo el producto. */
    color: var(--board-accent);
  }

  /* El tablero. `.board-root` y `.frame-root` son HERMANOS conceptualmente: los tokens del
     tablero se declaran aquí y no heredan del marco. */
  .board-root {
    display: grid;
    grid-template-rows: 1fr auto;
    align-content: start;
  }

  .rejilla {
    display: grid;
    grid-template-columns: repeat(var(--cols, 4), var(--t, 60px));
    gap: var(--sep, 10.8px);
    justify-content: center;
    align-content: start;
    padding: 1.5rem;
  }

  .celda {
    inline-size: var(--t, 60px);
    block-size: var(--t, 60px);
    /* Nunca por debajo de 24 px: WCAG 2.5.8, límite duro del sistema 4. */
    min-inline-size: 24px;
    min-block-size: 24px;
    display: grid;
    place-items: center;
    font-size: calc(var(--t, 60px) * 0.55);
    background: var(--board-bg);
    color: var(--board-ink);
    border: 2px solid var(--board-line);
    border-radius: 8px;
    cursor: pointer;
    /* Sin arrastre y sin gestos: un solo punto de activación. */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Las celdas de TEXTO no son cuadradas: una palabra no cabe en un cuadrado de 60 px, y
     forzarla lo haría ilegible. Se conserva el ALTO como tamaño de objetivo —que es lo que
     WCAG 2.5.8 mide junto al ancho— y el ancho crece con la palabra. */
  .rejilla[data-texto='si'] { grid-template-columns: repeat(var(--cols, 4), auto); }
  .celda-texto {
    inline-size: auto;
    min-inline-size: max(var(--t, 60px), 4.5rem);
    padding: 0 0.75rem;
    font-size: clamp(1rem, calc(var(--t, 60px) * 0.3), 2rem);
    font-variant-numeric: tabular-nums;
  }

  /* El estímulo de un instrumento de texto puede ser largo: no se recorta. */
  .objetivo { flex-wrap: wrap; }

  /* El indicador de foco ES el cursor de barrido. No hay un segundo modelo de foco. */
  .celda:focus-visible {
    outline: 3px solid var(--board-scan-cursor);
    outline-offset: 2px;
  }

  /* ACUSE DE RECIBO. Idéntico para acierto y para fallo: el selector no sabe cuál fue,
     porque el atributo no lleva esa información. */
  .celda[data-acuse='si'] {
    border-color: var(--board-ink);
    border-width: 4px;
  }
  .celda { transition: border-color 90ms linear, border-width 90ms linear; }

  /* Selector de instrumento. Vive en el marco, fuera del tablero. */
  .juegos { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; align-items: center; flex-wrap: wrap; }
  .juegos a {
    min-block-size: 44px; padding: 0 1rem; display: grid; place-items: center;
    font: inherit; text-decoration: none;
    background: var(--frame-bg); color: var(--frame-ink);
    border: 2px solid var(--frame-line); border-radius: 8px;
  }
  .juegos a[aria-current='page'] { border-color: var(--frame-accent); font-weight: 600; }
  .juegos a:focus-visible { outline: 3px solid var(--frame-accent); outline-offset: 2px; }

  /* Contenedores de destino de Clasificar. Activables como cualquier objeto: mismo
     tamaño mínimo, mismo acuse de recibo, mismo tratamiento en el barrido. */
  .contenedores {
    display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;
    padding: 1rem 1.5rem; border-top: 2px solid var(--board-line);
  }
  .contenedor {
    min-inline-size: max(var(--t, 60px), 7rem);
    min-block-size: var(--t, 60px);
    display: grid; place-items: center; padding: 0 1rem;
    font: inherit;
    background: var(--board-bg); color: var(--board-ink);
    border: 3px dashed var(--board-line); border-radius: 10px;
    cursor: pointer; touch-action: none;
  }
  .contenedor:focus-visible { outline: 3px solid var(--board-scan-cursor); outline-offset: 2px; }
  .contenedor[data-acuse='si'] { border-style: solid; border-color: var(--board-ink); }
  .contenedor-etiqueta { font-size: 1rem; }

  /* El tablero 3x3 del tres en raya. Es el ÚNICO instrumento donde la posición importa,
     así que su zona de destino es una rejilla fija de tres columnas, no una fila. */
  .contenedores[data-rejilla3='si'] {
    display: grid;
    grid-template-columns: repeat(3, var(--t, 60px));
    gap: 0.5rem;
    justify-content: center;
  }
  .casilla {
    min-inline-size: var(--t, 60px);
    inline-size: var(--t, 60px);
    block-size: var(--t, 60px);
    padding: 0;
    border-style: solid;
    font-size: calc(var(--t, 60px) * 0.5);
  }
  .casilla:disabled { cursor: not-allowed; }

  /* La SELECCIÓN no es el foco. Se distingue por FORMA además de color —un escalón en la
     esquina— para que sobreviva en escala de grises, que es lo que necesita un paciente
     con daltonismo usando barrido. */
  .celda[data-seleccionado='si'] {
    border-width: 4px;
    border-color: var(--board-ink);
    border-start-start-radius: 0;
    border-end-end-radius: 0;
    transform: translateY(-4px);
  }

  /* FRONTERA DE MODO. Con el panel abierto el tablero no es alcanzable: ni por puntero ni
     por teclado. Si el paciente lo viera, seguiría intentando resolverlo mientras el
     terapeuta cambia la configuración, y esos intentos entrarían al registro bajo una
     configuración que ya no es la que se estaba usando. */
  body[data-panel-abierto='si'] .board-root,
  body[data-panel-abierto='si'] .objetivo {
    visibility: hidden;
  }
  body[data-panel-abierto='si'] .celda,
  body[data-panel-abierto='si'] .contenedor {
    pointer-events: none;
  }

  .abridor {
    justify-self: end;
    margin: 0.75rem 1rem;
    min-block-size: 44px;
    padding: 0 1rem;
    font: inherit;
    background: var(--frame-bg);
    color: var(--frame-ink);
    border: 2px solid var(--frame-line);
    border-radius: 8px;
    cursor: pointer;
  }
  .abridor:focus-visible { outline: 3px solid var(--frame-accent); outline-offset: 2px; }

  /* OPACO, y cubre el tablero por completo. No una superposición semitransparente. */
  .panel {
    position: fixed;
    inset: 0;
    z-index: 10;
    /* Opacidad total: es el requisito, no una preferencia estética. */
    background: var(--frame-bg);
    color: var(--frame-ink);
    display: grid;
    grid-template-rows: 1fr auto;
    overflow: auto;
  }
  /* `display: grid` en `.panel` sobrescribe el `display: none` que el atributo `hidden`
     aplica por defecto, porque una clase gana a un selector de atributo. Sin esta regla el
     panel OCULTO cubre e intercepta toda la página, y la aplicación es inusable. */
  .panel[hidden] { display: none; }

  .panel-cuerpo { padding: 1.5rem; max-width: 60rem; }
  .panel h2 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem; }
  .panel h2:first-child { margin-top: 0; }

  /* Los dos ejes separados por un separador VISIBLE con rótulo, no solo por espacio. */
  .grupo {
    border: 2px solid var(--frame-line);
    border-radius: 8px;
    padding: 0.75rem 1rem 1rem;
    margin: 0 0 1rem;
  }
  .grupo legend { padding: 0 0.5rem; font-weight: 600; }

  .fila { display: grid; grid-template-columns: 14rem 1fr 5rem; gap: 0.75rem; align-items: center; margin: 0.5rem 0; }
  .fila input[type='range'] { inline-size: 100%; }
  .fila input[type='checkbox'] { inline-size: 24px; block-size: 24px; }
  .valor { font-variant-numeric: tabular-nums; text-align: right; }

  /* Escalones (ADR-0006). Sustituyen a los deslizadores en las cuatro perillas de
     dificultad: un deslizador se arrastra, y el arrastre esta prohibido como via unica.
     44px de lado es el minimo AAA de WCAG 2.5.8, y aqui no es negociable: el panel es la
     interfaz del terapeuta, pero tiene que ser operable con las mismas vias que el
     tablero. */
  .fila-escalones { grid-template-columns: 14rem 1fr; }
  .etiqueta-escalones { font-weight: 500; }
  .escalones { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .escalon {
    min-inline-size: 44px; min-block-size: 44px;
    padding: 0 0.5rem;
    font: inherit; font-variant-numeric: tabular-nums;
    color: var(--frame-ink); background: var(--frame-bg);
    border: 2px solid var(--frame-line); border-radius: 6px;
    cursor: pointer;
  }
  /* Una variante del eje de contenido lleva ETIQUETA, no número: es más ancha. */
  .escalon-texto { min-inline-size: auto; padding: 0 0.75rem; }
  .escalon[aria-checked='true'] {
    /* La marca NO es solo color: lleva grosor de borde y peso de texto. En escala de
       grises, y con colores forzados del sistema, sigue distinguiendose. */
    border-color: var(--frame-ink); border-width: 3px; font-weight: 700;
    background: var(--frame-accent-bg, var(--frame-bg));
  }
  .escalon:focus-visible { outline: 3px solid var(--frame-focus, currentColor); outline-offset: 2px; }
  @media (forced-colors: active) {
    .escalon[aria-checked='true'] { border-color: Highlight; color: Highlight; }
  }
  .nota { color: var(--frame-ink-soft); font-size: 0.9rem; margin: 0.25rem 0 0; }

  /* La distinción entre bloqueo y aviso es de PALABRA, no de tono: un terapeuta con
     daltonismo tiene que poder distinguirlas. El borde ayuda; el texto decide. */
  .mensaje { border-left: 4px solid var(--frame-line); padding: 0.5rem 0.75rem; margin: 0.5rem 0; }
  .mensaje.bloqueo { border-left-color: var(--frame-ink); font-weight: 600; }
  .progreso { color: var(--frame-ink-soft); margin-top: 1.5rem; }

  /* Una métrica SIN dato no se atenúa: "no se pudo medir" es información clínica, y a
     menudo más importante que el número. Mismo color y misma opacidad que las que sí
     tienen dato. */
  .metrica { display: grid; gap: 0.15rem; margin: 0 0 1rem; }
  .metrica-etiqueta { font-weight: 600; }
  .metrica-valor { color: var(--frame-ink); opacity: 1; }
  .metrica[data-tiene-dato='no'] .metrica-valor { color: var(--frame-ink); opacity: 1; }
  /* La limitación vive DENTRO del mismo contenedor que el valor, no en un pie. */
  .metrica-limitacion { color: var(--frame-ink-soft); font-size: 0.9rem; max-width: 46rem; }

  .aviso-provisional { grid-column: 1 / -1; }
  .aviso-contenido, .aviso-provisional {
    margin: 0 1rem 0.5rem; padding: 0.5rem 0.75rem;
    border-left: 4px solid var(--frame-line);
    color: var(--frame-ink); font-size: 0.95rem;
  }

  .acciones { display: flex; gap: 0.75rem; padding: 1rem 1.5rem; border-top: 2px solid var(--frame-line); }
  .accion {
    min-block-size: 44px; padding: 0 1.25rem; font: inherit; cursor: pointer;
    background: var(--frame-bg); color: var(--frame-ink);
    border: 2px solid var(--frame-line); border-radius: 8px;
  }
  .accion.primaria { border-color: var(--frame-accent); font-weight: 600; }
  .accion:disabled { color: var(--frame-ink-soft); cursor: not-allowed; }
  .accion:focus-visible { outline: 3px solid var(--frame-accent); outline-offset: 2px; }

  /* Estímulo reducido: ni una transición, ni un desvanecimiento. Instantáneo significa
     instantáneo. El acuse pierde el movimiento y CONSERVA la existencia. */
  .rejilla[data-sin-movimiento='si'] .celda { transition: none; }
  @media (prefers-reduced-motion: reduce) {
    .celda { transition: none; }
  }
</style>
</head>
<body>
<div class="frame-root">
  <!-- El panel vive en el ámbito del MARCO. `.frame-root` y `.board-root` son contenedores
       hermanos que nunca se anidan: es lo que impide que un token del marco se filtre al
       tablero, donde el umbral de contraste es clínico y no estético. -->
  <nav class="juegos" id="juegos" aria-label="Instrumento"></nav>
  <div id="marco-panel"></div>
  <div class="objetivo" id="zona-objetivo"></div>
  <!-- UN solo `.board-root`: es el ámbito que declara los tokens del tablero, y
       declararlos dos veces en elementos hermanos sería redundante y ambiguo. -->
  <div class="board-root" id="ambito-tablero">
    <div class="rejilla" id="tablero" role="group" aria-label="Tablero"></div>
    <div class="contenedores" id="contenedores" role="group"
         aria-label="Contenedores de destino" hidden></div>
  </div>
</div>

<script type="module">
  import { crearSesionViva } from './src/plataforma/sesion-viva.js';
  import { BANCO_PROVISIONAL } from './src/banco-provisional.js';
  // Import ESTÁTICO a propósito. Con `await import()` el resto del script corre DESPUÉS
  // del evento `load`, así que cualquier cosa que dependa de que la página esté lista
  // —una prueba de navegador, o un lector de pantalla— ve la página a medias.
  import { montarPanel } from './src/panel/panel-dom.js';

  const params = new URLSearchParams(location.search);
  const n = (clave, porDefecto) => {
    const v = params.get(clave);
    return v === null ? porDefecto : Number(v);
  };

  // --- Selector de instrumento. Los tres comparten TODA la infraestructura.
  const JUEGOS = [
    ['busca', 'Busca / Lince'],
    ['clasificar', 'Clasificar'],
    ['denominar', 'Denominación'],
    ['rellenar', 'Rellenar palabras'],
    ['ordenar', 'Ordenar palabras'],
    ['simbolos', 'Símbolos'],
    ['precios', 'Precio justo'],
    ['comprar', 'Comprar'],
    ['tresEnRaya', 'Tres en raya'],
  ];
  const tipo = JUEGOS.some(([id]) => id === params.get('j')) ? params.get('j') : 'busca';

  const nav = document.getElementById('juegos');
  for (const [id, etiqueta] of JUEGOS) {
    const a = document.createElement('a');
    const u = new URL(location.href);
    u.searchParams.set('j', id);
    a.href = u.toString();
    a.textContent = etiqueta;
    if (id === tipo) a.setAttribute('aria-current', 'page');
    nav.append(a);
  }

  const config = {
    t: n('t', 60),
    C: n('c', 12),
    sv: n('sv', 0.25),
    ss: n('ss', 0.25),
  };

  // ANDAMIO DE MEDICIÓN, no función de producto.
  //
  // El banco provisional tiene 32 elementos, así que `C = 100` no se puede pedir hoy: la
  // guarda del sistema 8 lo rechaza, y hace bien. `?rep=N` repite el banco con ids
  // sufijados para poder MEDIR el presupuesto de 100 elementos DOM que ADR-0005 dejó como
  // predicción sin medir.
  //
  // Desaparece el día que el banco real tenga 96 elementos.
  const rep = Math.max(1, n('rep', 1));
  const banco = rep === 1
    ? [...BANCO_PROVISIONAL]
    : Array.from({ length: rep }, (_, k) =>
        BANCO_PROVISIONAL.map((e) => ({ ...e, id: k === 0 ? e.id : `${e.id}~${k}` })),
      ).flat();

  // Si la configuración no es realizable, el panel DEBE abrir mostrando el conflicto en
  // lugar de que la página muera. Es el caso límite del GDD: "si la configuración guardada
  // ya no es válida, el panel abre mostrando el conflicto y sin permitir empezar".
  //
  // Lo destapó una prueba de navegador con `c=100` sobre el banco de 32: sin este
  // try/catch, `arrancar` lanzaba y no se montaba ni el botón del panel, así que el
  // terapeuta se quedaba con una pantalla en blanco y sin forma de corregir nada.
  // Configuración de acceso: de PACIENTE, no de ejercicio.
  const acceso = {
    barrido: params.get('barrido') === '1',
    msVuelta: n('vuelta', 12000),
    permanencia: params.get('dwell') === '1',
    msPermanencia: n('ms', 800),
  };

  // Si la configuración no es realizable, el panel DEBE abrir mostrando el conflicto en
  // lugar de que la página muera. Es el caso límite del GDD del sistema 11.
  let viva = null;
  let estado = null;
  let arranqueFallido = null;
  try {
    viva = crearSesionViva({
      raiz: document.getElementById('tablero'),
      zonaObjetivo: document.getElementById('zona-objetivo'),
      zonaContenedores: document.getElementById('contenedores'),
      tipo,
      banco,
      config,
      nContenedores: n('nc', 3),
      acceso,
      // Eje de contenido, sistema 32. `undefined` resuelve a la variante más fácil.
      ...(params.get('tarea') === null ? {} : { varianteContenido: params.get('tarea') }),
      prefersReducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
    });
    estado = viva.estado;
  } catch (err) {
    arranqueFallido = err instanceof Error ? err.message : String(err);
  }

  // ---- Panel del terapeuta y frontera de modo ----
  const estadoPanel = {
    abierto: false,
    config: { ...config },
    // El instrumento, para que el panel sepa si hay eje de contenido (sistema 32).
    instrumento: tipo,
    ...(params.get('tarea') === null ? {} : { varianteContenido: params.get('tarea') }),
    acceso: {
      barrido: acceso.barrido,
      msVuelta: 12000,
      estimuloReducido: false,
      limitaciones: params.get('lim') ? params.get('lim').split(',') : [],
    },
  };

  const panel = montarPanel({
    contenedor: document.getElementById('marco-panel'),
    // La frontera pausa la sesión de verdad, no solo la oculta.
    alAbrir: () => { viva?.estado?.montado?.pausar(); },
    alCerrar: () => { viva?.estado?.montado?.reanudar(); },
    estado: estadoPanel,
    bancoActivo: banco.filter((e) => e.status === 'activo').length,
    anchoDisponible: () => document.getElementById('tablero').clientWidth || 1280,
    prefersReducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
    progreso: () => viva === null
      ? { tableros: 0, intentos: 0, aciertos: 0 }
      : {
          tableros: viva.sesion.tableros.length,
          intentos: viva.estado.instrumento.intentos.length,
          aciertos: viva.estado.instrumento.intentos.filter((i) => i.correcto).length,
        },
    sesion: () => viva?.sesionConTableros?.() ?? null,
    ultimoTablero: () => {
      const t = viva?.estado?.instrumento?.tablero;
      return t === undefined ? null : { svPedida: t.svPedida, svEfectiva: t.svEfectiva };
    },
    alAplicar: (nueva, accesoNuevo, variante) => {
      // **SIN RECARGAR.** Era el bloqueante S1: `location.href` destruía la sesión entera.
      // Aplicar surte efecto en el tablero siguiente, no en una sesión siguiente.
      if (viva === null) {
        // El arranque había fallado: la única vía es recargar con la configuración nueva.
        const url = new URL(location.href);
        url.searchParams.set('t', String(nueva.t));
        url.searchParams.set('c', String(nueva.C));
        url.searchParams.set('sv', String(nueva.sv));
        url.searchParams.set('ss', String(nueva.ss));
        url.searchParams.set('j', tipo);
        location.href = url.toString();
        return;
      }
      estado = viva.reconfigurar({
        config: nueva,
        ...(variante === undefined ? {} : { varianteContenido: variante }),
        acceso: {
          barrido: accesoNuevo?.barrido ?? acceso.barrido,
          msVuelta: accesoNuevo?.msVuelta ?? acceso.msVuelta,
          permanencia: acceso.permanencia,
          msPermanencia: acceso.msPermanencia,
        },
      });
      globalThis.__busca = { viva, estado, config: nueva, panel, estadoPanel };
    },
  });

  // Aviso de contenido: los precios caducan, y el terapeuta tiene que saberlo ANTES de
  // interpretar un resultado.
  if (estado !== null && estado.avisoContenido !== undefined) {
    const av = document.createElement('p');
    av.className = 'aviso-contenido';
    av.textContent = `⚠ ${estado.avisoContenido}`;
    document.getElementById('juegos').after(av);
  }

  // Cuatro de los nueve juegos usan contenido que escribió el desarrollador, no un
  // clínico. Mientras nadie con la titulación lo firme, la página lo dice a la cara: un
  // aviso que no se ve equivale a no haberlo puesto.
  // SEIS juegos, no cinco: 'comprar' usa el catálogo provisional de precios, y faltaba.
  const CON_CONTENIDO_PROVISIONAL = [
    'rellenar', 'simbolos', 'precios', 'ordenar', 'tresEnRaya', 'comprar',
  ];
  if (CON_CONTENIDO_PROVISIONAL.includes(tipo)) {
    const nota = document.createElement('p');
    // Clase PROPIA: el aviso de caducidad de los precios es otra cosa, y un test comprueba
    // que ese sale solo en precio justo. Compartir la clase los hacia indistinguibles.
    nota.className = 'aviso-provisional';
    nota.append(
      document.createTextNode('⚠ Contenido PROVISIONAL, sin revisar por un terapeuta. '),
    );
    const enlace = document.createElement('a');
    enlace.href = 'docs/revision-contenido.md';
    enlace.textContent = 'Hoja de revisión';
    nota.append(enlace);
    nota.append(document.createTextNode('.'));
    document.getElementById('juegos').after(nota);
  }

  // Si el arranque falló, el panel se abre solo: no hay nada que hacer en la pantalla del
  // paciente hasta que la configuración sea realizable.
  if (arranqueFallido !== null) {
    document.getElementById('zona-objetivo').textContent =
      'Configuración no realizable. Corrígela en el panel del terapeuta.';
    panel.abrir();
  }

  // Superficie mínima para las pruebas de navegador. No es API de producto.
  globalThis.__busca = { viva, estado, config, panel, estadoPanel, arranqueFallido };
</script>
</body>
