# Entity Registry
#
# Hechos que cruzan documentos. Un valor vive aquí una sola vez, y los GDD lo
# citan en lugar de repetirlo. Si un GDD necesita un valor distinto, eso es un
# conflicto que hay que resolver, no un número que se cambia en silencio.
#
# NUNCA se renumeran ni se reescriben valores existentes sin declarar el conflicto.
# Actualizado por /design-system y verificado por /consistency-check.

constants:
  - name: Cmin
    value: 9
    unit: elementos
    description: Tablero mínimo. Dominio inferior de objetivos(C).
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md

  - name: Cmax
    value: 100
    unit: elementos
    description: >
      Tablero máximo que el producto permite. Dimensiona el banco de imágenes
      entero: subirlo después obliga a producir más contenido.
    safe_range: [50, 150]
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md
      - design/gdd/game-concept.md

  - name: objetivosMin
    value: 3
    unit: objetivos
    description: Objetivos a encontrar en el tablero mínimo.
    safe_range: [2, 5]
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md

  - name: objetivosMax
    value: 10
    unit: objetivos
    description: >
      Objetivos a encontrar en el tablero máximo. Elegido para preservar
      distractores(100) = 90, y así no invalidar cifras ya citadas en otros
      documentos.
    safe_range: [8, 15]
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md

  - name: Rmax
    value: 4
    unit: repeticiones
    description: >
      Repeticiones medias máximas aceptables por distractor único, en similitud
      visual máxima, en el tablero más grande. Junto con Cmax es una de las dos
      perillas con consecuencia económica directa del proyecto.
    safe_range: [2, 6]
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md
      - design/gdd/game-concept.md

  - name: clusterMin
    value: 24
    unit: elementos por grupo visual
    derived: true
    derivation: ceil(distractores(Cmax) / Rmax) + 1
    description: >
      Mínimo de elementos activos por grupo visual. DERIVADA de Cmax y Rmax: no
      se fija a mano. Sustituye el rango "aproximadamente 23-30" que aparecía
      antes en game-concept.md, que no era una entrada válida de validación.
      ESCALÓN DE APLICACIÓN POR NIVEL: en el Nivel 0 (MVP, 30 imágenes en total)
      es ADVERTENCIA, porque ningún reparto de 30 imágenes satisface un mínimo de
      24 y el primer manifiesto sería inválido por construcción. Del Nivel 1 en
      adelante BLOQUEA el build. El escalón existe para que la salida fácil no sea
      bajar clusterMin, que es lo único que hace real la perilla de similitud visual.
      CONFIRMADA CLÍNICAMENTE el 2026-08-26: el colaborador confirmó que la
      similitud semántica y la visual son ejes distintos (sesión 2, pregunta 0.1),
      así que el banco es la rama de 384 elementos (16 x 24) y NO la de ~130 que
      habría resultado de fusionar los dos ejes. Esta derivación queda validada,
      no solo derivada.
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md
      - design/gdd/game-concept.md

  - name: solapamientoMax
    value: 0.7
    unit: fracción
    description: >
      Techo de etiquetado cruzado por asset. Por encima, el pool de similitud
      "ninguna" se encoge demasiado y el eje semántico deja de discriminar.
      Incumplirlo es advertencia de calidad de datos, no error bloqueante.
    safe_range: [0.5, 0.8]
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md

  - name: G
    value: 16
    unit: clusters visuales
    description: >
      Clusters visuales distintos en el banco. Es el coste real de producción de
      contenido: las categorías semánticas son gratis, los clusters no. 13 si se
      reutilizan clusters entre categorías vía etiquetado múltiple.
    safe_range: [13, 20]
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md
      - design/gdd/game-concept.md

  - name: Rsesion
    value: null
    unit: apariciones por sesión
    description: >
      PENDIENTE. Techo diagnóstico de reaparición de un mismo asset a lo largo de
      una sesión. No se puede fijar sin telemetría real de B (tableros por
      sesión). Ver F7: la habituación de sesión NO se resuelve dimensionando el
      banco.
    blocked_on: telemetría real de tableros por sesión
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md

  - name: umbralContrasteTablero
    value: 4.5
    unit: razón de contraste
    description: >
      Umbral VINCULANTE y bloqueante para todo par declarado del ámbito tablero.
      Decidido en F1 del sistema 2 a partir de la auditoría de tokens: con 7:1
      caerían tres pares del prototipo, todos de texto secundario, donde la presión
      de paleta es máxima. Subir el suelo agotaría la paleta sin mejorar la
      accesibilidad real. 7:1 queda como deseable, reportado y no bloqueante.
    source: design/gdd/tokens-tema-contraste.md
    referenced_by:
      - design/gdd/tokens-tema-contraste.md
      - design/gdd/manifiesto-banco-imagenes.md

  - name: alphaThreshold
    value: 128
    unit: valor de canal alfa
    description: Alfa desde el que un píxel cuenta como sujeto al medir contraste de silueta. F2 del sistema 2.
    safe_range: [1, 254]
    source: design/gdd/tokens-tema-contraste.md
    referenced_by:
      - design/gdd/tokens-tema-contraste.md

  - name: bandWidthPx
    value: 2
    unit: px
    description: Ancho del anillo perimetral muestreado al medir contraste de silueta. F2 del sistema 2.
    safe_range: [1, 4]
    source: design/gdd/tokens-tema-contraste.md
    referenced_by:
      - design/gdd/tokens-tema-contraste.md

  - name: k
    value: 0.18
    unit: fracción del tamaño de objetivo
    description: >
      Factor de separación entre objetivos. Elegido para que la fracción y el piso
      absoluto se crucen exactamente en 44 px, la frontera clínica entre el modo de
      reto motor y la escalera estándar. PENDIENTE CLÍNICO: sale de razonamiento de
      ingeniería, no de medición de temblor real.
    safe_range: [0.12, 0.25]
    source: design/gdd/tokens-tema-contraste.md
    referenced_by:
      - design/gdd/tokens-tema-contraste.md

  - name: separacionMin
    value: 8
    unit: px
    description: >
      Piso absoluto de separación entre objetivos, activo por debajo de 44 px.
      PENDIENTE CLÍNICO, igual que k.
    safe_range: [6, 12]
    source: design/gdd/tokens-tema-contraste.md
    referenced_by:
      - design/gdd/tokens-tema-contraste.md

  - name: distanciaPerceptualMin
    value: 20
    unit: delta E (CIELAB, CIE76)
    description: >
      Piso de ADVERTENCIA para "se ven claramente distintos" entre dos TOKENS. Muy
      por encima del umbral de laboratorio de diferencia justo perceptible (~2.3),
      a propósito: visión subóptima en tableta de consulta.
      DOMINIO RECORTADO tras /design-review: token contra token, NO assets
      fotográficos. F6 no tiene procedimiento de extracción de color para una
      fotografía, así que la afirmación anterior de que daba una herramienta al
      sistema 1 se retiró. Si el sistema 13 la quiere, define primero la extracción.
      Nota de asimetría: contraste>=4.5 implica dE>=~43 (barrido de 200k pares), así
      que F1 subsume a F6 para figura/fondo; el recíproco es falso.
    safe_range: [15, 30]
    source: design/gdd/tokens-tema-contraste.md
    referenced_by:
      - design/gdd/tokens-tema-contraste.md
      - design/gdd/manifiesto-banco-imagenes.md

  - name: boardBgInvariante
    value: true
    unit: booleano
    description: >
      El fondo del tablero NO depende del tema. Un solo valor, claro, fijo.
      Razón: doce objetos plausibles medidos contra el fondo dan seis fallos en tema
      claro y seis en oscuro, con CERO fallos en ambos — los conjuntos son
      complementarios. Con un banco fijo y tema conmutable, la mitad del banco queda
      fuera de norma en el tema activo. Y el encuadre es de PILAR 3: conmutar el tema
      alteraría la dificultad clínica sin que el terapeuta toque una perilla.
      Un tablero oscuro es un ajuste clínico del Nivel 1, explícito y registrado.
    source: design/gdd/tokens-tema-contraste.md
    referenced_by:
      - design/gdd/tokens-tema-contraste.md
      - design/gdd/manifiesto-banco-imagenes.md

formulas:
  - name: objetivos
    expression: >
      clamp(round(objetivosMin + (objetivosMax - objetivosMin) * (C - Cmin) / (Cmax - Cmin)),
      objetivosMin, objetivosMax)
    variables: [C, Cmin, Cmax, objetivosMin, objetivosMax]
    output_range: [3, 10]
    description: >
      Objetivos a encontrar en un tablero de C elementos. SUSTITUYE a
      max(3, round(C * 0.1)), que producía una meseta inicial de 26 muescas
      seguida de mesetas de 10 y contaminaba la comparación longitudinal.
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md

  - name: distractores
    expression: C - objetivos(C)
    variables: [C]
    output_range: [6, 90]
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md

  - name: repeticiones
    expression: distractores(C) / len(pool_nivel(t))
    variables: [C, nivel, t]
    output_range: [0, null]
    description: >
      Media de apariciones de cada distractor único en un tablero. Deliberadamente
      sin acotar: es la señal de alarma, no un valor que la fórmula limite. Describe
      la MEDIA con muestreo con reemplazo; para un techo duro por semilla, el
      generador debe barajar sin reemplazo.
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md

  - name: clusterMin
    expression: ceil(distractores(Cmax) / Rmax) + 1
    variables: [Cmax, Rmax]
    output_range: [2, null]
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md
      - design/gdd/game-concept.md

  - name: solapamiento
    expression: unionCategorias(t) / (N - 1)
    variables: [t, N]
    output_range: [0, 1]
    description: >
      Fracción del banco NO disponible como distractor "ninguna" para ese
      objetivo. Cuantifica el riesgo de sobre-etiquetado.
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md

  - name: bancoTotal
    expression: sum(clusterSize(g) for g in 1..G)
    variables: [G, clusterSize]
    output_range: [312, null]
    description: >
      Imágenes únicas totales. 384 con 16 clusters al mínimo; 312 si se reutilizan
      clusters entre categorías. El modelo antiguo "categorías x grupos x tamaño"
      ya no aplica: las categorías son etiquetas transversales y no multiplican.
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md
      - design/gdd/game-concept.md

  - name: tasaReaparicion
    expression: (B * k) / clusterSize(id.cluster)
    variables: [B, k, clusterSize]
    output_range: [0, null]
    description: >
      Apariciones esperadas de un asset a lo largo de una SESIÓN. Fórmula de
      MONITORIZACIÓN, no de dimensionado. Demuestra que la habituación de sesión no
      se resuelve agrandando el banco: haría falta un cluster de 226 elementos.
      Se resuelve con política de muestreo (sistema 8) e instrumentación (sistema 9).
    source: design/gdd/manifiesto-banco-imagenes.md
    referenced_by:
      - design/gdd/manifiesto-banco-imagenes.md

  # ----------------------------------------------------------------------------
  # Sistema 4 — modelo de dificultad. design/gdd/modelo-dificultad.md
  # ----------------------------------------------------------------------------

  - name: tMin
    value: 24
    unit: px
    description: >
      Tamaño de objetivo mínimo absoluto. LÍMITE DURO, no preferencia: es el mínimo
      de WCAG 2.2 criterio 2.5.8. El terapeuta no puede bajar de aquí, y un valor
      inferior se RECHAZA, nunca se recorta.
    source: design/gdd/modelo-dificultad.md
    referenced_by:
      - design/gdd/modelo-dificultad.md
      - docs/engine-reference/web/modules/accessibility.md

  - name: tAAA
    value: 44
    unit: px
    description: >
      Mínimo AAA de WCAG 2.5.8. No es un límite: es la FRONTERA DONDE LOS DOS EJES
      DEJAN DE SER INDEPENDIENTES. Por debajo, un paciente con control psicomotor
      reducido falla tocando al lado del objetivo correcto, y ese fallo entra en el
      registro como si no hubiera encontrado el objetivo. La sesión se marca
      ejesAcoplados y la métrica del eje perceptivo no se calcula.
    source: design/gdd/modelo-dificultad.md
    referenced_by:
      - design/gdd/modelo-dificultad.md

  - name: tMax
    value: 140
    unit: px
    description: >
      Tamaño de objetivo máximo. Techo de disposición: por encima, el tablero no cabe
      a Cmax elementos.
    source: design/gdd/modelo-dificultad.md
    referenced_by:
      - design/gdd/modelo-dificultad.md

  - name: Cmin
    value: 3
    unit: elementos
    description: >
      Elementos mínimos en un tablero. Con menos de 3 no hay búsqueda.
    source: design/gdd/modelo-dificultad.md
    referenced_by:
      - design/gdd/modelo-dificultad.md

  - name: wC
    value: 0.40
    unit: peso
    validated: false
    description: >
      Peso de la CANTIDAD en la dificultad perceptiva (F2). SIN VALIDACIÓN EMPÍRICA.
      wC + wV + wS = 1 por construcción: si alguien cambia uno sin ajustar otro, dp
      deja de estar acotada en 100 y AC-5 lo delata.
    source: design/gdd/modelo-dificultad.md
    referenced_by:
      - design/gdd/modelo-dificultad.md

  - name: wV
    value: 0.40
    unit: peso
    validated: false
    description: >
      Peso de la SIMILITUD VISUAL en F2. SIN VALIDACIÓN EMPÍRICA. Está al mismo nivel
      que wC porque en búsqueda visual la similitud entre objetivo y distractor es el
      determinante principal del tiempo de búsqueda, por encima del tamaño del
      conjunto. Es una elección defendible, no un dato de este producto.
    source: design/gdd/modelo-dificultad.md
    referenced_by:
      - design/gdd/modelo-dificultad.md

  - name: wS
    value: 0.20
    unit: peso
    validated: false
    description: >
      Peso de la SIMILITUD SEMÁNTICA en F2. SIN VALIDACIÓN EMPÍRICA. La mitad que la
      visual: la similitud de significado estorba menos que la de forma cuando la
      tarea es encontrar algo mirando.
    source: design/gdd/modelo-dificultad.md
    referenced_by:
      - design/gdd/modelo-dificultad.md

  - name: precisionObjetivo
    value: 0.80
    unit: proporción
    validated: false
    description: >
      Precisión que se mantiene CONSTANTE para medir el progreso (F3). El eje de
      progreso del producto no es la precisión: es cuánta dificultad tolera el
      paciente manteniendo esta precisión. SIN VALIDACIÓN EMPÍRICA, y candidata a
      convertirse en perilla clínica en lugar de constante de proyecto.
    source: design/gdd/modelo-dificultad.md
    referenced_by:
      - design/gdd/modelo-dificultad.md

  - name: nMin
    value: 5
    unit: intentos
    validated: false
    description: >
      Intentos mínimos para que un nivel de dificultad cuente en F3. SIN VALIDACIÓN
      EMPÍRICA. Su razón de existir es concreta: sin él, tres aciertos por suerte en
      el nivel más difícil harían que el registro dijera que el paciente mejoró un
      58% en una sesión.
    source: design/gdd/modelo-dificultad.md
    referenced_by:
      - design/gdd/modelo-dificultad.md

  # ----------------------------------------------------------------------------
  # Sistema 5 — capa de adaptación de entrada. design/gdd/capa-adaptacion-entrada.md
  # ----------------------------------------------------------------------------

  - name: msPasoMin
    value: 400
    unit: ms
    validated: false
    description: >
      Suelo de la cadencia del barrido automático. Por debajo nadie llega a reaccionar.
      SIN VALIDACIÓN EMPÍRICA. Es el suelo que hace que subir C degrade el barrido de
      forma DECLARADA en lugar de silenciosa: a partir de nPasos = 30 con msVuelta =
      12000, la vuelta real deja de cumplir la configurada y el panel lo avisa.
    source: design/gdd/capa-adaptacion-entrada.md
    referenced_by:
      - design/gdd/capa-adaptacion-entrada.md

  - name: msPasoMax
    value: 4000
    unit: ms
    validated: false
    description: >
      Techo de la cadencia del barrido. Por encima la espera es cruel.
      SIN VALIDACIÓN EMPÍRICA.
    source: design/gdd/capa-adaptacion-entrada.md
    referenced_by:
      - design/gdd/capa-adaptacion-entrada.md

  - name: pxToleranciaMin
    value: 8
    unit: px
    validated: false
    description: >
      Suelo absoluto de la zona de tolerancia. SIN VALIDACIÓN EMPÍRICA.
    source: design/gdd/capa-adaptacion-entrada.md
    referenced_by:
      - design/gdd/capa-adaptacion-entrada.md

  - name: ratioTolerancia
    value: 0.25
    unit: fracción del tamaño de objetivo
    validated: false
    description: >
      Fracción de t que define el radio de tolerancia. SIN VALIDACIÓN EMPÍRICA.
      CONFLICTO CONOCIDO Y RESUELTO: por encima de t = 32 la tolerancia (0,25t) supera
      la separación entre objetivos del sistema 2 (max(8, 0,18t)) — a t=60 son 15 px
      contra 10,8 — así que la zona de tolerancia se solapa con el objetivo vecino.
      Resolución: la tolerancia NUNCA captura un punto que caiga dentro de otro
      objetivo; se aplica solo al espacio vacío, y en caso de duda gana el objetivo
      cuyo centro esté más cerca. El conflicto no lo vio ninguno de los dos GDD por
      separado: aparece solo al poner las dos fórmulas juntas.
    source: design/gdd/capa-adaptacion-entrada.md
    referenced_by:
      - design/gdd/capa-adaptacion-entrada.md
      - design/gdd/tokens-tema-contraste.md

  - name: msVuelta
    value: 12000
    unit: ms
    validated: false
    description: >
      Tiempo de una vuelta completa del barrido automático. Perilla CLÍNICA, de
      paciente y no de ejercicio. La perilla es la VUELTA y no el paso a propósito:
      con la perilla en el paso, subir C de 12 a 40 multiplicaría por 3,3 el tiempo de
      vuelta sin que el terapeuta tocara nada — una entrada moviendo un parámetro
      clínico en silencio.
    source: design/gdd/capa-adaptacion-entrada.md
    referenced_by:
      - design/gdd/capa-adaptacion-entrada.md

  - name: msPermanencia
    value: 800
    unit: ms
    validated: false
    description: >
      Tiempo sobre el objetivo para que la activación por permanencia dispare. Perilla
      CLÍNICA. Junto a msVuelta, son las dos constantes más fáciles de validar del
      proyecto: se observan en una sola sesión con un paciente que use esas vías.
    source: design/gdd/capa-adaptacion-entrada.md
    referenced_by:
      - design/gdd/capa-adaptacion-entrada.md
